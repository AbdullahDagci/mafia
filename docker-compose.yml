# Yalnızca yerel geliştirme içindir. Parola geliştirme amaçlıdır; üretimde kullanılmaz.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: suspayi
      POSTGRES_PASSWORD: suspayi_dev
      POSTGRES_DB: suspayi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suspayi -d suspayi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
